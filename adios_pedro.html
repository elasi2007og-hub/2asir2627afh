<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adiós Pedro</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: radial-gradient(circle at center, #1a0000 0%, #000 100%); 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            cursor: crosshair; 
        }
        canvas { 
            display: block; 
        }
        #instructions { 
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            text-align: center; 
            color: rgba(255,100,100,0.5); 
            font-size: 14px; 
            pointer-events: none; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="instructions">Pasa el ratón sobre el texto</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let particles = [];
        let width, height;
        const text = "Adiós Pedro";
        
        const mouse = { x: -1000, y: -1000, radius: 120 };
        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
        
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            ctx.fillStyle = 'white';
            let fontSize = Math.min(width / 6, 180);
            ctx.font = `900 ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);
            
            const data = ctx.getImageData(0, 0, width, height).data;
            ctx.clearRect(0, 0, width, height);
            
            const step = 4;
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    const alpha = data[index + 3];
                    if (alpha > 128) {
                        const r = 255;
                        const g = Math.floor(Math.random() * 100) + 20;
                        const b = Math.floor(Math.random() * 50);
                        const color = `rgb(${r},${g},${b})`;
                        particles.push(new Particle(x, y, color));
                    }
                }
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.ox = x;
                this.oy = y;
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 1;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.friction = 0.88;
                this.ease = 0.04;
            }
            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    const angle = Math.atan2(dy, dx);
                    this.vx -= Math.cos(angle) * force * 8;
                    this.vy -= Math.sin(angle) * force * 8;
                }
                
                this.x += (this.ox - this.x) * this.ease;
                this.y += (this.oy - this.y) * this.ease;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.vx *= this.friction;
                this.vy *= this.friction;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(10, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        
        init();
        animate();
        
        window.addEventListener('resize', init);
    </script>
</body>
</html>
